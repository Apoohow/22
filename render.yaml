services:
  - type: web
    name: ncufoodmap
    env: python
    rootDirectory: .
    buildCommand: cd foodmap/NCUFOODMAP_DJANGO && pip install -r requirements.txt
    startCommand: cd foodmap/NCUFOODMAP_DJANGO && python manage.py migrate && python manage.py collectstatic --noinput && gunicorn core.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.0
      - key: DATABASE_URL
        fromDatabase:
          name: ncufoodmap_db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: false
      - key: WEB_CONCURRENCY
        value: 4

databases:
  - name: ncufoodmap_db
    databaseName: ncufoodmap
    user: ncufoodmap 