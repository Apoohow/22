services:
  - type: web
    name: ncufoodmap
    env: python
    buildCommand: |
      mkdir -p /opt/render/project/src/deploy
      cp -r foodmap/NCUFOODMAP_DJANGO/* /opt/render/project/src/deploy/
      cd /opt/render/project/src/deploy
      pip install -r requirements.txt
    startCommand: |
      cd /opt/render/project/src/deploy
      python manage.py migrate
      python manage.py collectstatic --noinput
      gunicorn core.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.0
      - key: DATABASE_URL
        fromDatabase:
          name: ncufoodmap_db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: false
      - key: WEB_CONCURRENCY
        value: 4

databases:
  - name: ncufoodmap_db
    databaseName: ncufoodmap
    user: ncufoodmap 